<body><main class="app">
<h1>思想史・章別穴埋め演習 <span style="font-size:14px;color:#51677f;font-weight:500">補充版</span></h1>
<p class="lead">第1～9章・各3パターン（計396問）を収録。解答の略称・別名が説明文に露出する問題も修正し、同じ解答が別の箇所に現れる場合は同じ番号で伏せています。インターネット接続は不要です。</p>
<div class="toolbar no-print">
  <label class="control" for="chapter">章<select id="chapter" aria-label="章を選択"></select></label>
  <label class="control" for="pattern">パターン<select id="pattern"><option value="A">A：用語・人物</option><option value="B">B：定義・関連事項</option><option value="C">C：事例・周辺知識</option></select></label>
  <div class="actions">
    <button type="button" class="action primary" id="toggle">解答一覧を表示</button>
    <button type="button" class="action" id="reset">個別の解答を隠す</button>
    <button type="button" class="action" id="print">問題を印刷</button>
  </div>
</div>
<div class="stats no-print"><span id="counts" class="tag"></span><span id="progress" aria-live="polite"></span></div>
<section class="paper" aria-label="問題用紙">
  <div class="paper-header"><h2 id="page-title"></h2><p id="pattern-caption"></p></div>
  <p class="tip no-print">空欄をクリックすると、その番号の解答を個別に確認できます。同じ番号が複数ある場合は、まとめて表示されます。</p>
  <div class="question" id="question" aria-label="穴埋め問題"></div>
  <pre class="print-question" id="print-question"></pre>
  <div class="answer-panel" id="answer" hidden><h3>解答一覧</h3><div class="answer-grid" id="answer-grid"></div></div>
</section>
<p class="notes no-print">注：元の講義メモに基づいて出題しています。原文への追記は〔補足問題〕で区別しています。元メモ全体の事実確認は行っていません。第10章は元メモに本文がないため収録していません。解答一覧は印刷されません。</p>

｜原文への追記〕\n物価変動の影響を取り除いたGDPを【15】＿＿＿＿GDPと呼ぶ。","answers":[{"number":1,"value":"知的権威・体制","line":2},{"number":2,"value":"国内で生産された付加価値の合計","line":5},{"number":3,"value":"国民が生産した付加価値の合計","line":6},{"number":4,"value":"寿命・教育・所得","line":12},{"number":5,"value":"聞き取り調査","line":14},{"number":6,"value":"人間の安全保障","line":18},{"number":7,"value":"潜在能力","line":18},{"number":8,"value":"国富のわけまえ","line":20},{"number":9,"value":"GDP","line":22},{"number":10,"value":"ベンサム","line":26},{"number":11,"value":"総和","line":37},{"number":12,"value":"総積","line":38},{"number":13,"value":"最小値","line":39},{"number":14,"value":"ナイル川から水を引き","line":41},{"number":15,"value":"実質","line":0}],"n":15},"C":{"question":"反知性主義：知的権威・体制に懐疑的な立場をとる主義。ポピュリズム(【1】＿＿＿＿)とも。\n【1】＿＿＿＿：一般大衆の利益や願望、不安などの大衆的基盤を用いて【2】＿＿＿＿に打ち勝とうとする主義。\n\nGDP(国内総生産)：国内で生産された付加価値の合計。【3】＿＿＿＿\nGNP(国民総生産)：国民が生産した付加価値の合計。【4】＿＿＿＿\n\n〔参考メモ〕感染症が蔓延したときにワクチンが売れた、酒やたばこの密輸、売春などのネガティブな消費も含まれる\n(薬を開発する人・売る人などの給料を払うために原材料費にプラスしないといけない。これが付加価値という扱いになる。)\n〔参考メモ〕国の豊かさを表す指標としては不適ではないか？\n\nHDI(人間開発指数)：寿命・教育・所得を組み合わせて総合評価。GDPと高い相関。しかし【5】＿＿＿＿。\n\nGNH(国民総幸福)：国民への聞き取り調査をもとに算出される幸福度。生活の充実・政治への満足など。\n\n〔参考メモ〕日本人は満足を7～8/10と付ける人が多い。しかし他の国では10/10が付けられることが多い。google mapのレビューなど見ても顕著。日本とオーストラリアを比較。つまり国民性に値が依存するので国を跨いだ公平な比較はできない。\n\nUNDP(United Nations Development Program)：1994年に「人間の安全保障」を取り上げる。提唱者はセン。センは人間の可能性という概念を「潜在能力」と呼ぶ。潜在能力を可能な限り開発させることで我々は【6】＿＿＿＿から救われるだろう。と説いた。\n\nオランダ病：豊富な地下資源で国富の総量は増えるが、その国富のわけまえが国民に行き渡らないため、国民生活自体は困窮する状況。\n\n赤道ギニア：GDPが油田によって高くなったのにその分配が不平等で、国全体は貧しいまま。\n\n効用(utility)：幸福の尺度。(類：効用関数：高いほうがシステムの質が良い)\n\n最大多数の最大幸福：【9】＿＿＿＿が提唱。全員の快楽計算の【12】＿＿＿＿の最大化を効用に求める。\n\n幸福総量が同じでも、一人の大きな幸福より多数の小さな幸福のほうが効用が高く評価されるべきという考えもある。【7】＿＿＿＿がこれに近い(【12】＿＿＿＿でなく【13】＿＿＿＿をみる)。つまり、「あるべきもの」があることを良い社会とする。\n「すべて国民は、【8】＿＿＿＿」\nは、日本での適用例。\n\n功利主義：行為の善悪の判断を、それが快楽や幸福をもたらすか否かに求める倫理観。【9】＿＿＿＿が提唱\n\nたとえば、「困っている友人に嘘をついて安心させるべきか、正直に厳しい真実を伝えるべきか」という場面を考えてみましょう。義務論的な立場なら「【10】＿＿＿＿」と考えるかもしれません。しかし功利主義の立場では、行為そのものの性質(嘘かどうか)ではなく、「どちらの選択が、【11】＿＿＿＿」という結果に注目します。安心という幸福が、後で真実を知った際の失望という苦痛を上回るなら、功利主義的にはその嘘は正当化され得る、という考え方をするのです。行為の「動機」ではなく「結果」を判断基準に置く——これが功利主義の最大の特徴です。\n\n功利主義基準：【12】＿＿＿＿\n【7】＿＿＿＿：【13】＿＿＿＿\nマクシミン基準：【14】＿＿＿＿\n\nゲジラ計画：スーダン中央部で計画された。ナイル川から水を引き、大規模に綿花栽培しようとしたもの。国富は増大したが、【15】＿＿＿＿\n\n〔補足問題｜原文への追記〕\n物価変動を含めた金額で計算するGDPは【16】＿＿＿＿GDPである。","answers":[{"number":1,"value":"大衆主義","line":2},{"number":2,"value":"既存の権威","line":3},{"number":3,"value":"Gross Domestic Product","line":5},{"number":4,"value":"Gross National Product","line":6},{"number":5,"value":"幸福度とはあまり相関がない","line":12},{"number":6,"value":"貧困や飢餓","line":18},{"number":7,"value":"ナッシュ基準","line":28},{"number":8,"value":"健康で文化的な最低限度の生活を営む権利を有する","line":29},{"number":9,"value":"ベンサム","line":33},{"number":10,"value":"嘘をつくこと自体が不正だ","line":35},{"number":11,"value":"関係する人々全体の幸福を最大化するか","line":35},{"number":12,"value":"総和","line":37},{"number":13,"value":"総積","line":38},{"number":14,"value":"最小値","line":39},{"number":15,"value":"農業技術の向上や活性化につながらなかった","line":41},{"number":16,"value":"名目","line":0}],"n":16}},"2":{"A":{"question":"【1】＿＿＿＿：世俗の職業は神から与えられた使命であるという考え。【2】＿＿＿＿とルターがこれを説く。\n\n【2】＿＿＿＿：フランス出身の、スイスの宗教改革者。働けば神に救われる。予定説。\n\n【3】＿＿＿＿：「信仰に基づく禁欲的な働き方が資本の蓄積を促し、近代の経済体制の形成につながった」と論じた書物。【4】＿＿＿＿が書いた。\n\n【4】＿＿＿＿：ドイツの社会学者。【3】＿＿＿＿を書いた。\n\n理念型論：【4】＿＿＿＿が提唱。よくわからない。\n\n【5】＿＿＿＿：【4】＿＿＿＿が提唱。何かを認識する場合には、善悪や美醜といった価値判断と、何が事実かという事実判断を峻別し、社会科学では事実判断をもって仕事とするべきとする原則。【5】＿＿＿＿の原則では、対象化と自己分析的な事実認識を行う事で、観察者自身が陥りそうな偏見を予期することが可能となり、冷静な事実判断が可能になる。事実判断を行う「私」自身が捕らわれている価値の根本を探りだすことで、「価値からの自由」を得ることが可能になると述べた。「自分自身をも相対的に批判できるような視点を持つこと」\n\n【6】＿＿＿＿：自由を代償にカネを手にする\n【7】＿＿＿＿：本来【6】＿＿＿＿とは人とのつながりを生む喜ばしいものなのだ\n\n【8】＿＿＿＿：江戸時代。心学の創始者。\n\n【9】＿＿＿＿：江戸時代末期。通称、金次郎。農村の復興と開発の指導者。\n\n【10】＿＿＿＿：森戸辰夫が【11】＿＿＿＿にロシアの無政府主義者「クロポトキン」の論説(国家や権威の存在を否定し、「相互扶助」を基盤とする無政府共産主義を提唱したもの)を翻訳発表したことに右翼(保守)が反発した事件。言論弾圧の例。\n\n【12】＿＿＿＿：自分の利益を最大にしようと行動する主義\n【13】＿＿＿＿：皇国民は【7】＿＿＿＿こそが責任かつ栄誉と定め、産業の効率性を高めるべきという考え。\n\n戦争が終わったら【7】＿＿＿＿という言葉は反発を受けそうなものだが、右派左派ともに【7】＿＿＿＿という言葉を強調したため残った。「すべて国民は、【7】＿＿＿＿の権利を有し、義務を負う」\n\n【14】＿＿＿＿：「すべて国民は、健康で文化的な最低限度の生活を営む権利を有する」->【7】＿＿＿＿の義務を果たさない人には【14】＿＿＿＿を保証する義務はない、という考えが渡っていた。\n\n【15】＿＿＿＿：人間裁判ともよばれる。朝日茂(入院患者)が、「600円の日用品費で【14】＿＿＿＿は保証されるのか？」という主張で厚生大臣を訴訟したもの。二審で【17】＿＿＿＿説により敗訴。\n\n【16】＿＿＿＿：似たようなもの。【17】＿＿＿＿説で敗訴した。\n\n【17】＿＿＿＿：国家の努力目標や方針を示したもの。【14】＿＿＿＿などがこれにあたる。なお、この規定はそれを具体化する立法がなされない限り国民はその権利を主張できない。\nつまり、国民の権利を国家の努力義務とみなし、国民は権利を主張できないというもの。\nどこまで権利を認めるかは国家の裁量。【7】＿＿＿＿の義務を果たさない者には【14】＿＿＿＿を保証しない。\n\n【18】＿＿＿＿：憲法上の【14】＿＿＿＿は裁判上の救済となりうる。【17】＿＿＿＿説の逆。\n\n【19】＿＿＿＿：1955年前後の総理大臣。福祉国家の完成。国民皆保険、国民皆年金を整える。日米安全保障条約で反発を受ける(【20】＿＿＿＿)。\n\n【20】＿＿＿＿：旧安保条約の改定交渉内容が世界の緊張緩和の流れと逆行するとして国民的反対運動につながった。\n\n【21】＿＿＿＿：国民所得倍増計画。【7】＿＿＿＿者中心の政策。社会福祉を弱め、公共投資と所得税減税を行い、小さな政府へ舵を切る。\n\nヨーロッパ\n働かざる者=特権階級\n\n日本\n働かざる者=貧しい者\n\n→価値観が違うため、日本人には生活保護や貧困対策よりも先に公共投資による【7】＿＿＿＿の機会の確保が行われた\n→教育や家は有料のまま。貯蓄をしなければいけないという意識が広まった。// これが「自己責任が【7】＿＿＿＿国家を支える」の根底\n→【22】＿＿＿＿の高さ\n→銀行のお金が増える、企業はそれを借り入れて事業をできる\n→経済成長\n\n【23】＿＿＿＿。中小企業や農家への貸付を政府が低い金利で行う\n→地方に雇用が残り、コミュニティが維持された。企業も共助\n\n経済成長が止まった時にこの構造は崩れる\n\n【24】＿＿＿＿：国際金融当局が銀行の自己資本比率8%以上を義務化した\n→銀行の貸し渋り\n\n不動産価格の下落+不良債権\n→銀行は企業に対して、貸し付けを減らす・担保を増やすよう要請\n→企業は借金を一斉に返そうとする\n→返済金を得るために賃金が削られる\n→物価下落\n→現金の価値が相対的に上がり、企業の借金が増える\n→賃金がさらに減る...\n(【25】＿＿＿＿)\n\nITの発展による専門職の価値の低下\n賃金が安い新興国の商品が先進国に流入し、先進国の賃金まで下がる\n賃金を減らすため、非正規雇用も広がる\n\nそもそも社会保障・みんなの利益が少ない日本社会で、どこから歳出を減らせばいいのか\n税金の無駄遣いをあぶりだす政治状況に\n\nなぜ社会のやさしさが失われたのか？\n\n中間層の生活の質の悪化が原因と書かれている\n\n【26】＿＿＿＿：格差の大きさを表す指標。日本はOECD内で9番目に大きい。\n【27】＿＿＿＿：税引き後所得が中央値の半分未満の人の割合。6番目に大きい。\n\n経済成長がないと不安定化する社会構造がGDP信仰を強めている\n\n〔補足問題｜原文への追記〕\nウェーバーの理念型は、現実の特徴を強調して組み立てた【28】＿＿＿＿であり、道徳的な理想像とは異なる。","answers":[{"number":1,"value":"職業召命観","line":3},{"number":2,"value":"カルヴァン","line":5},{"number":3,"value":"プロテスタンティズムの倫理と資本主義の精神","line":7},{"number":4,"value":"ウェーバー","line":9},{"number":5,"value":"価値自由","line":13},{"number":6,"value":"労働","line":15},{"number":7,"value":"勤労","line":16},{"number":8,"value":"石田梅岩","line":18},{"number":9,"value":"二宮尊徳","line":20},{"number":10,"value":"森戸事件","line":22},{"number":11,"value":"1920年","line":22},{"number":12,"value":"利己主義","line":24},{"number":13,"value":"皇国勤労観","line":25},{"number":14,"value":"生存権","line":29},{"number":15,"value":"朝日訴訟","line":31},{"number":16,"value":"堀木訴訟","line":33},{"number":17,"value":"プログラム規定","line":35},{"number":18,"value":"法的権利説","line":39},{"number":19,"value":"岸信介","line":41},{"number":20,"value":"安保反対闘争","line":43},{"number":21,"value":"池田勇人","line":45},{"number":22,"value":"家計貯蓄率","line":55},{"number":23,"value":"財政投融資","line":59},{"number":24,"value":"BIS規制","line":64},{"number":25,"value":"バランスシート不況","line":74},{"number":26,"value":"ジニ指数","line":87},{"number":27,"value":"相対的貧困率","line":88},{"number":28,"value":"分析上のモデル","line":0}],"n":28},"B":{"question":"職業召命観：世俗の職業は【1】＿＿＿＿（召命）であるという考え。カルヴァンとルターがこれを説く。\n\nカルヴァン：フランス出身の、【2】＿＿＿＿。働けば神に救われる。予定説。\n\n【4】＿＿＿＿：「信仰に基づく禁欲的な働き方が【3】＿＿＿＿を促し、近代の経済体制の形成につながった」と論じた書物。【5】＿＿＿＿が書いた。\n\n【5】＿＿＿＿：ドイツの社会学者。【4】＿＿＿＿を書いた。\n\n理念型論：【5】＿＿＿＿が提唱。よくわからない。\n\n価値自由：【5】＿＿＿＿が提唱。何かを認識する場合には、善悪や美醜といった【6】＿＿＿＿と、何が事実かという事実判断を峻別し、社会科学では事実判断をもって仕事とするべきとする原則。価値自由の原則では、対象化と自己分析的な事実認識を行う事で、観察者自身が陥りそうな偏見を予期することが可能となり、冷静な事実判断が可能になる。事実判断を行う「私」自身が捕らわれている価値の根本を探りだすことで、「【7】＿＿＿＿」を得ることが可能になると述べた。「自分自身をも相対的に批判できるような視点を持つこと」\n\n労働：自由を代償にカネを手にする\n勤労：本来労働とは人とのつながりを生む喜ばしいものなのだ\n\n石田梅岩：江戸時代。【8】＿＿＿＿。\n\n二宮尊徳：江戸時代末期。通称、【9】＿＿＿＿。農村の復興と開発の指導者。\n\n森戸事件：森戸辰夫が1920年にロシアの無政府主義者「クロポトキン」の論説(国家や権威の存在を否定し、「【10】＿＿＿＿」を基盤とする無政府共産主義を提唱したもの)を翻訳発表したことに右翼(保守)が反発した事件。言論弾圧の例。\n\n利己主義：【11】＿＿＿＿にしようと行動する主義\n皇国勤労観：皇国民は【12】＿＿＿＿と定め、産業の効率性を高めるべきという考え。\n\n戦争が終わったら勤労という言葉は反発を受けそうなものだが、右派左派ともに勤労という言葉を強調したため残った。「すべて国民は、勤労の権利を有し、義務を負う」\n\n【17】＿＿＿＿：「すべて国民は、【13】＿＿＿＿を営む権利を有する」->勤労の義務を果たさない人には【17】＿＿＿＿を保証する義務はない、という考えが渡っていた。\n\n朝日訴訟：人間裁判ともよばれる。【14】＿＿＿＿(入院患者)が、「600円の日用品費で【17】＿＿＿＿は保証されるのか？」という主張で厚生大臣を訴訟したもの。二審で【15】＿＿＿＿により敗訴。\n\n堀木訴訟：似たようなもの。【15】＿＿＿＿で敗訴した。\n\n当該憲法解釈に関わる規定：【16】＿＿＿＿を示したもの。【17】＿＿＿＿などがこれにあたる。なお、この規定はそれを具体化する立法がなされない限り国民はその権利を主張できない。\nつまり、国民の権利を国家の努力義務とみなし、国民は権利を主張できないというもの。\nどこまで権利を認めるかは国家の裁量。勤労の義務を果たさない者には【17】＿＿＿＿を保証しない。\n\n法的権利説：憲法上の【17】＿＿＿＿は裁判上の救済となりうる。【15】＿＿＿＿の逆。\n\n岸信介：1955年前後の総理大臣。福祉国家の完成。国民皆保険、国民皆年金を整える。日米安全保障条約で反発を受ける(安保反対闘争)。\n\n安保反対闘争：【18】＿＿＿＿の改定交渉内容が世界の緊張緩和の流れと逆行するとして国民的反対運動につながった。\n\n池田勇人：【19】＿＿＿＿。勤労者中心の政策。社会福祉を弱め、公共投資と所得税減税を行い、小さな政府へ舵を切る。\n\nヨーロッパ\n働かざる者=特権階級\n\n日本\n働かざる者=貧しい者\n\n→価値観が違うため、日本人には生活保護や貧困対策よりも先に公共投資による勤労の機会の確保が行われた\n→教育や家は有料のまま。貯蓄をしなければいけないという意識が広まった。// これが「自己責任が勤労国家を支える」の根底\n→家計貯蓄率の高さ\n→銀行のお金が増える、企業はそれを借り入れて事業をできる\n→経済成長\n\n財政投融資。中小企業や農家への貸付を政府が低い金利で行う\n→地方に雇用が残り、コミュニティが維持された。企業も共助\n\n経済成長が止まった時にこの構造は崩れる\n\nBIS規制：国際金融当局が銀行の自己資本比率【20】＿＿＿＿を義務化した\n→銀行の貸し渋り\n\n不動産価格の下落+不良債権\n→銀行は企業に対して、貸し付けを減らす・担保を増やすよう要請\n→企業は借金を一斉に返そうとする\n→返済金を得るために賃金が削られる\n→物価下落\n→現金の価値が相対的に上がり、企業の借金が増える\n→賃金がさらに減る...\n(バランスシート不況)\n\nITの発展による専門職の価値の低下\n賃金が安い新興国の商品が先進国に流入し、先進国の賃金まで下がる\n賃金を減らすため、非正規雇用も広がる\n\nそもそも社会保障・みんなの利益が少ない日本社会で、どこから歳出を減らせばいいのか\n税金の無駄遣いをあぶりだす政治状況に\n\nなぜ社会のやさしさが失われたのか？\n\n中間層の生活の質の悪化が原因と書かれている\n\nジニ指数：格差の大きさを表す指標。日本は【21】＿＿＿＿に大きい。\n相対的貧困率：税引き後所得が【22】＿＿＿＿の人の割合。6番目に大きい。\n\n経済成長がないと不安定化する社会構造がGDP信仰を強めている\n\n〔補足問題｜原文への追記〕\nカルヴァンの予定説では、誰が救済されるかは【23】＿＿＿＿によってあらかじめ定められていると考える。","answers":[{"number":1,"value":"神から与えられた使命","line":3},{"number":2,"value":"スイスの宗教改革者","line":5},{"number":3,"value":"資本の蓄積","line":7},{"number":4,"value":"プロテスタンティズムの倫理と資本主義の精神","line":9},{"number":5,"value":"ウェーバー","line":11},{"number":6,"value":"価値判断","line":13},{"number":7,"value":"価値からの自由","line":13},{"number":8,"value":"心学の創始者","line":18},{"number":9,"value":"金次郎","line":20},{"number":10,"value":"相互扶助","line":22},{"number":11,"value":"自分の利益を最大","line":24},{"number":12,"value":"勤労こそが責任かつ栄誉","line":25},{"number":13,"value":"健康で文化的な最低限度の生活","line":29},{"number":14,"value":"朝日茂","line":31},{"number":15,"value":"プログラム規定説","line":33},{"number":16,"value":"国家の努力目標や方針","line":35},{"number":17,"value":"生存権","line":39},{"number":18,"value":"旧安保条約","line":43},{"number":19,"value":"国民所得倍増計画","line":45},{"number":20,"value":"8%以上","line":64},{"number":21,"value":"OECD内で9番目","line":87},{"number":22,"value":"中央値の半分未満","line":88},{"number":23,"value":"神","line":0}],"n":23},"C":{"question":"職業召命観：世俗の職業は神から与えられた使命（召命）であるという考え。カルヴァンと【1】＿＿＿＿がこれを説く。\n\nカルヴァン：フランス出身の、スイスの宗教改革者。働けば神に救われる。【2】＿＿＿＿。\n\nプロテスタンティズムの倫理と資本主義の精神：「禁欲的に職業にまい進すべきとするプロテスタンティズムな精神が資本の蓄積を促し、資本主義社会をもたらすこととなった」という理解を示した書物。ウェーバーが書いた。\n\nウェーバー：ドイツの社会学者。プロテスタンティズムの倫理と資本主義の精神を書いた。\n\n理念型論：ウェーバーが提唱。よくわからない。\n\n価値自由：ウェーバーが提唱。何かを認識する場合には、善悪や美醜といった価値判断と、何が事実かという事実判断を峻別し、社会科学では事実判断をもって仕事とするべきとする原則。価値自由の原則では、対象化と自己分析的な事実認識を行う事で、観察者自身が陥りそうな偏見を予期することが可能となり、冷静な事実判断が可能になる。事実判断を行う「私」自身が捕らわれている価値の根本を探りだすことで、「価値からの自由」を得ることが可能になると述べた。「自分自身をも相対的に批判できるような視点を持つこと」\n\n労働：自由を代償にカネを手にする\n勤労：本来労働とは人とのつながりを生む喜ばしいものなのだ\n\n石田梅岩：江戸時代。心学の創始者。\n\n二宮尊徳：江戸時代末期。通称、金次郎。農村の復興と開発の指導者。\n\n森戸事件：森戸辰夫が1920年にロシアの無政府主義者「クロポトキン」の論説(国家や権威の存在を否定し、「相互扶助」を基盤とする無政府共産主義を提唱したもの)を翻訳発表したことに右翼(保守)が反発した事件。言論弾圧の例。\n\n利己主義：自分の利益を最大にしようと行動する主義\n皇国勤労観：皇国民は勤労こそが責任かつ栄誉と定め、産業の効率性を高めるべきという考え。\n\n戦争が終わったら勤労という言葉は反発を受けそうなものだが、右派左派ともに勤労という言葉を強調したため残った。「すべて国民は、【3】＿＿＿＿、義務を負う」\n\n【6】＿＿＿＿：「すべて国民は、健康で文化的な最低限度の生活を営む権利を有する」->勤労の義務を果たさない人には【6】＿＿＿＿を保証する義務はない、という考えが渡っていた。\n\n朝日訴訟：人間裁判ともよばれる。朝日茂(入院患者)が、「600円の日用品費で【6】＿＿＿＿は保証されるのか？」という主張で厚生大臣を訴訟したもの。二審で【4】＿＿＿＿により敗訴。\n\n堀木訴訟：似たようなもの。【4】＿＿＿＿で敗訴した。\n\n当該憲法解釈に関わる規定：国家の努力目標や方針を示したもの。【6】＿＿＿＿などがこれにあたる。なお、この規定はそれを【5】＿＿＿＿がなされない限り国民はその権利を主張できない。\nつまり、国民の権利を国家の努力義務とみなし、国民は権利を主張できないというもの。\nどこまで権利を認めるかは国家の裁量。勤労の義務を果たさない者には【6】＿＿＿＿を保証しない。\n\n法的権利説：憲法上の【6】＿＿＿＿は裁判上の救済となりうる。【4】＿＿＿＿の逆。\n\n岸信介：1955年前後の総理大臣。福祉国家の完成。国民皆保険、国民皆年金を整える。日米安全保障条約で反発を受ける(【7】＿＿＿＿)。\n\n【7】＿＿＿＿：【8】＿＿＿＿の改定交渉内容が世界の緊張緩和の流れと逆行するとして国民的反対運動につながった。\n\n池田勇人：国民所得倍増計画。勤労者中心の政策。社会福祉を弱め、公共投資と所得税減税を行い、小さな政府へ舵を切る。\n\nヨーロッパ\n働かざる者=【9】＿＿＿＿\n\n日本\n働かざる者=【10】＿＿＿＿\n\n→価値観が違うため、日本人には生活保護や貧困対策よりも先に公共投資による勤労の機会の確保が行われた\n→教育や家は有料のまま。貯蓄をしなければいけないという意識が広まった。// これが「【11】＿＿＿＿」の根底\n→家計貯蓄率の高さ\n→銀行のお金が増える、企業はそれを借り入れて事業をできる\n→経済成長\n\n財政投融資。【12】＿＿＿＿\n→地方に雇用が残り、コミュニティが維持された。【13】＿＿＿＿\n\n経済成長が止まった時にこの構造は崩れる\n\nBIS規制：国際金融当局が銀行の自己資本比率【14】＿＿＿＿を義務化した\n→銀行の貸し渋り\n\n不動産価格の下落+【15】＿＿＿＿\n→銀行は企業に対して、貸し付けを減らす・【16】＿＿＿＿よう要請\n→企業は借金を一斉に返そうとする\n→返済金を得るために【17】＿＿＿＿\n→物価下落\n→現金の価値が相対的に上がり、企業の借金が増える\n→賃金がさらに減る...\n(【18】＿＿＿＿)\n\nITの発展による専門職の価値の低下\n賃金が安い新興国の商品が先進国に流入し、【19】＿＿＿＿\n賃金を減らすため、【20】＿＿＿＿\n\nそもそも社会 "number":14,"value":"資本主義制","line":0},{"number":15,"value":"共産主義制","line":0},{"number":16,"value":"アダム・スミス","line":0}],"n":16}},"4":{"A":{"question":"3択以上の多数決では票の割れが起きる\nゴアvsブッシュの選挙、第三の党としてネーダーが参加。ネーダーはゴアに近い主張を出し、ゴアの表を喰う。\n結果、主張としては少数派のはずであるブッシュが勝利する\n\n日本でも、自民10万票、民主9万票、共産3万票\n民主と共産が左翼として組めば勝てていた\n\n逆に、【1】＿＿＿＿によって自民の票が食われたこともあった\n\n【2】＿＿＿＿：勝てる見込みのない候補者のこと\n\n多数決は泡沫候補の存在に結果が左右される。\nこれを防げないか？\n・決選投票を付ける(日本の首相選出についても、1位が過半数でなければ2位と決選投票をすることになっている)\nしかしそれでも最初の多数決では票の割れが残る。極右政党が1つだけ出てきたときにそれだけ票の割れが起きないために右翼票を丸ごと集められる。\n【3】＿＿＿＿：多数決がうまくいかない典型例。検討事項それぞれに対して多数決をとるのと結論に対して多数決を取るので結果が変わるということ。\n\n・【4】＿＿＿＿：点数形式にする（1位に3点、2位に2点、3位に1点　など）こと。スコアリングルール。\n\n・【5】＿＿＿＿：立候補するときに300万円などの金額を預け、一定以上の得票がなければそれを没収する、足切りの制度。泡沫候補の出現の一定の抑止力になる。\n\n多数決のルール\n・ボスがいてはいけない(実質的な有権者数が減る)\n・周りに左右されてはいけない(ノイズ)\n・間違えた情報を有権者に与えてはいけない(入力の誤り)\n\n国会での多数決で法案の採否を決めるが、そもそも基本的人権など憲法に違反する法律は制定してはならないとされる\nしかし【6】＿＿＿＿にはその防波堤がない\nさらにその条文自体を多数決で決められた議員が守らなければ、それを覆せない\n\n【7】＿＿＿＿：宗教団体への特権付与禁止、政治権力の行使の禁止、公的機関による宗教教育の禁止、宗教団体に対する財政援助の禁止\n\n【8】＿＿＿＿：アメリカ・イギリス軍が「イラクは大量破壊兵器を持っている」として行った攻撃。フセイン政権を打倒。\n\n〔補足問題｜原文への追記〕\n第三候補の存在が有力候補の得票を分散させ、勝敗を変えるのは【9】＿＿＿＿効果の一例。","answers":[{"number":1,"value":"幸福実現党","line":9},{"number":2,"value":"泡沫(ほうまつ)候補","line":11},{"number":3,"value":"オストロゴルスキーのパラドックス","line":17},{"number":4,"value":"ボルダルール","line":19},{"number":5,"value":"選挙供託金","line":21},{"number":6,"value":"憲法改正の国民投票","line":29},{"number":7,"value":"政教分離","line":33},{"number":8,"value":"イラク戦争","line":35},{"number":9,"value":"スポイラー","line":0}],"n":9},"B":{"question":"3択以上の【3】＿＿＿＿では票の割れが起きる\nゴアvs【1】＿＿＿＿の選挙、第三の党としてネーダーが参加。ネーダーはゴアに近い主張を出し、ゴアの表を喰う。\n結果、主張としては少数派のはずである【1】＿＿＿＿が勝利する\n\n日本でも、自民10万票、民主9万票、共産3万票\n民主と共産が左翼として組めば勝てていた\n\n逆に、幸福実現党によって自民の票が食われたこともあった\n\n泡沫(ほうまつ)候補：【2】＿＿＿＿のこと\n\n【3】＿＿＿＿は泡沫候補の存在に結果が左右される。\nこれを防げないか？\n・決選投票を付ける(日本の首相選出についても、1位が過半数でなければ2位と決選投票をすることになっている)\nしかしそれでも最初の【3】＿＿＿＿では票の割れが残る。極右政党が1つだけ出てきたときにそれだけ票の割れが起きないために右翼票を丸ごと集められる。\nオストロゴルスキーのパラドックス：【3】＿＿＿＿がうまくいかない典型例。検討事項それぞれに対して【3】＿＿＿＿をとるのと結論に対して【3】＿＿＿＿を取るので結果が変わるということ。\n\n・ボルダルール：【4】＿＿＿＿にする（1位に3点、2位に2点、3位に1点　など）こと。スコアリングルール。\n\n・選挙供託金：立候補するときに【5】＿＿＿＿などの金額を預け、一定以上の得票がなければそれを没収する、足切りの制度。泡沫候補の出現の一定の抑止力になる。\n\n【3】＿＿＿＿のルール\n・ボスがいてはいけない(実質的な有権者数が減る)\n・周りに左右されてはいけない(ノイズ)\n・間違えた情報を有権者に与えてはいけない(入力の誤り)\n\n国会での【3】＿＿＿＿で法案の採否を決めるが、そもそも基本的人権など憲法に違反する法律は制定してはならないとされる\nしかし憲法改正の国民投票にはその防波堤がない\nさらにその条文自体を【3】＿＿＿＿で決められた議員が守らなければ、それを覆せない\n\n政教分離：【6】＿＿＿＿、政治権力の行使の禁止、公的機関による宗教教育の禁止、宗教団体に対する財政援助の禁止\n\nイラク戦争：アメリカ・イギリス軍が「イラクは【7】＿＿＿＿を持っている」として行った攻撃。フセイン政権を打倒。\n\n〔補足問題｜原文への追記〕\nボルダルールでは、候補者に付けた【8】＿＿＿＿を点数に換算して集計する。","answers":[{"number":1,"value":"ブッシュ","line":3},{"number":2,"value":"勝てる見込みのない候補者","line":11},{"number":3,"value":"多数決","line":17},{"number":4,"value":"点数形式","line":19},{"number":5,"value":"300万円","line":21},{"number":6,"value":"宗教団体への特権付与禁止","line":33},{"number":7,"value":"大量破壊兵器","line":35},{"number":8,"value":"順位","line":0}],"n":8},"C":{"question":"3択以上の多数決では【1】＿＿＿＿が起きる\nゴアvs【2】＿＿＿＿の選挙、第三の党としてネーダーが参加。ネーダーはゴアに近い主張を出し、ゴアの表を喰う。\n結果、主張としては少数派のはずである【2】＿＿＿＿が勝利する\n\n日本でも、自民10万票、民主9万票、【3】＿＿＿＿\n民主と共産が左翼として組めば勝てていた\n\n逆に、幸福実現党によって自民の票が食われたこともあった\n\n泡沫(ほうまつ)候補：勝てる見込みのない候補者のこと\n\n多数決は泡沫候補の存在に結果が左右される。\nこれを防げないか？\n・決選投票を付ける(日本の首相選出についても、1位が過半数でなければ2位と決選投票をすることになっている)\nしかしそれでも最初の多数決では【1】＿＿＿＿が残る。極右政党が1つだけ出てきたときにそれだけ【1】＿＿＿＿が起きないために右翼票を丸ごと集められる。\nオストロゴルスキーのパラドックス：多数決がうまくいかない典型例。検討事項それぞれに対して多数決をとるのと結論に対して多数決を取るので結果が変わるということ。\n\n・ボルダルール：点数形式にする（1位に3点、2位に2点、3位に1点　など）こと。【4】＿＿＿＿。\n\n・選挙供託金：立候補するときに300万円などの金額を預け、一定以上の得票がなければそれを没収する、足切りの制度。【5】＿＿＿＿。\n\n多数決のルール\n・ボスがいてはいけない(実質的な有権者数が減る)\n・周りに左右されてはいけない(【6】＿＿＿＿)\n・間違えた情報を有権者に与えてはいけない(【7】＿＿＿＿)\n\n国会での多数決で法案の採否を決めるが、そもそも基本的人権など憲法に違反する法律は制定してはならないとされる\n【8】＿＿＿＿\nさらにその条文自体を多数決で決められた議員が守らなければ、それを覆せない\n\n政教分離：宗教団体への特権付与禁止、政治権力の行使の禁止、公的機関による宗教教育の禁止、宗教団体に対する財政援助の禁止\n\nイラク戦争：アメリカ・イギリス軍が「イラクは大量破壊兵器を持っている」として行った攻撃。フセイン政権を打倒。\n\n〔補足問題｜原文への追記〕\n複数の望ましい条件をすべて満たす投票制度は存在しないとするのは【9】＿＿＿＿の不可能性定理。","answers":[{"number":1,"value":"票の割れ","line":2},{"number":2,"value":"ブッシュ","line":4},{"number":3,"value":"共産3万票","line":6},{"number":4,"value":"スコアリングルール","line":19},{"number":5,"value":"泡沫候補の出現の一定の抑止力になる","line":21},{"number":6,"value":"ノイズ","line":25},{"number":7,"value":"入力の誤り","line":26},{"number":8,"value":"しかし憲法改正の国民投票にはその防波堤がない","line":29},{"number":9,"value":"アロー","line":0}],"n":9}},"5":{"A":{"question":"【1】＿＿＿＿：外国の武力侵略から国家の安全を防衛すること。勢力均衡方式(戦前)と集団【1】＿＿＿＿方式(戦後)。\n\n【2】＿＿＿＿：国家だけでなく人間一人ひとりの生命や人権を大切にしようという考え。UNDPが1994に提唱。\n\n【3】＿＿＿＿：イギリスの経済学者。人間の潜在能力（識字能力や自由な言語能力）の育成が飢餓や貧困の対策に重要だと説いた。\n\n【4】＿＿＿＿：日本の同盟国が攻撃されたときに自衛隊が出動することを可能にする法案。「集団的自衛権の行使」は9条に違反しないと政府は主張。反対派は憲法違反を主張し、実際にはアメリカの戦争に日本が巻き込まれるだけのマイナスしかない法案だと主張。与党側がこの法案を指示することは最初から分かっていたので、デモや抗議集会が起こった。\n\n【5】＿＿＿＿：【6】＿＿＿＿内閣の時に起きた。旧安保条約の改定交渉が1958年10月から始まり、世界の緊張緩和に逆行する内容のそれを批判するため、日米【1】＿＿＿＿条約改定阻止国民会議を結成。結局衆議院で強行採決され、解散。\n\nこのようなデモ活動は憲法21条「集会の自由」によって法に従って行われたもの。\n\n【7】＿＿＿＿：同性愛者・両性愛者・トランスジェンダーを自称する人々。\n\n正統性(漢字に注意。「当」でなく「統」)：運動参加者と相手に共有されている価値観のこと。たとえば、【4】＿＿＿＿の抗議デモは、憲法は守るべきもので平和は価値のあるもの、という前提が正統性として位置づけられている。\n\nまた、江戸時代の百姓一揆、領主側は百姓の生活安定に努めるべきという考えがあった。こうした考えを打ち出すことで百姓側に「領主とは有り難いもの」という印象を与え、服従を引き出せる(仁政イデオロギー)。逆に領主側がその印象を維持できないと、やるべきことをしていない領主に抗議する、という正統性が生まれる。\n\n一方、抗議相手が「憲法なんか守る必要はない」と主張している場合、それを主張しても意味がない。社会の多くの人々がそう考えていれば、運動は広がりを見せずに失敗する。(正統性の確保の失敗)\n\n実際に、百姓一揆では農具を持って抗議をするという作法があったが、江戸時代後期になると武装を始めるなどする。さらに盗みや放火・殺人をするなど、作法が崩壊し、正統性がなくなった。\n\n【8】＿＿＿＿：1904年2月。日本は苦勝。賠償金は取れなかった。\n【9】＿＿＿＿：ロシアから賠償金を取れなかった政府の外交を弱腰と非難する運動だったが、賃金上昇率とがんばりが結びつかない不満を持つ人々がそれに合流して暴動に発展し、正統性が失われたもの。\n\n【10】＿＿＿＿：【4】＿＿＿＿のとき、結成された学生団体。自由と民主主義を尊重するために日本国憲法を守るべきだ、という主張で発足した。しかし、メンバー内の慰安婦やフェミニズムなどの問題への思想に対する批判が出た(関係ない側面で正統性を欠いているとされた)。ある一面で正統性が認められた運動が、別の側面で正統性を欠くように見える\n合流した運動が一つの正統性を持つことができなかった\n\n運動を起こすには個人が結びつき私たちとなる必要がある\nしかしその結びつきの軸が多様化し、一つの私たちを立ち上げられなくなっている\n\n多様な私たちの存在を認められるのはいいが、私たちの対立があるなかどう声を上げるべきなのか？\nどうすればより大きな私たちが可能になるのか？\n\n【11】＿＿＿＿：国家は個人相互の契約に基づいているという考え。人民が自己の権利を守るための権力を国家に信託することに由来。ホッブズ・ロック・ルソー。\n\n【12】＿＿＿＿：1880年の政策。厳しい緊縮財政がデフレを招く。資本主義経済の基盤。\n【13】＿＿＿＿：松方デフレ政策により起きた。農民が困民党を組織、減税を叫ぶ。\n\n〔補足問題｜原文への追記〕\n運動の正統性は、法律に適合しているかという【14】＿＿＿＿とは区別して考える。","answers":[{"number":1,"value":"安全保障","line":2},{"number":2,"value":"人間の安全保障","line":4},{"number":3,"value":"アマーティア=セン","line":6},{"number":4,"value":"安全保障関連法案","line":8},{"number":5,"value":"安保反対闘争","line":10},{"number":6,"value":"岸信介","line":10},{"number":7,"value":"性的少数者(セクシュアルマイノリティ)","line":14},{"number":8,"value":"日露戦争","line":24},{"number":9,"value":"日比谷焼き打ち事件","line":25},{"number":10,"value":"SEALDs","line":27},{"number":11,"value":"社会契約説","line":36},{"number":12,"value":"松方財政","line":38},{"number":13,"value":"秩父事件","line":39},{"number":14,"value":"合法性","line":0}],"n":14},"B":{"question":"安全保障：【1】＿＿＿＿から国家の安全を防衛すること。勢力均衡方式(戦前)と集団安全保障方式(戦後)。\n\n人間の安全保障：国家だけでなく【2】＿＿＿＿を大切にしようという考え。UNDPが1994に提唱。\n\nアマーティア=セン：イギリスの経済学者。【3】＿＿＿＿（識字能力や自由な言語能力）の育成が飢餓や貧困の対策に重要だと説いた。\n\n安全保障関連法案：日本の同盟国が攻撃されたときに自衛隊が出動することを可能にする法案。「集団的自衛権の行使」は9条に違反しないと政府は主張。反対派は憲法違反を主張し、実際にはアメリカの戦争に日本が巻き込まれるだけのマイナスしかない法案だと主張。与党側がこの法案を指示することは最初から分かっていたので、デモや抗議集会が起こった。\n\n安保反対闘争：【4】＿＿＿＿内閣の時に起きた。旧安保条約の改定交渉が1958年10月から始まり、世界の緊張緩和に逆行する内容のそれを批判するため、日米安全保障条約改定阻止国民会議を結成。結局衆議院で強行採決され、解散。\n\nこのようなデモ活動は憲法21条「集会の自由」によって法に従って行われたもの。\n\n性的少数者(セクシュアルマイノリティ)：【5】＿＿＿＿を自称する人々。\n\n正統性(漢字に注意。「当」でなく「統」)：運動参加者と相手に共有されている価値観のこと。たとえば、安全保障関連法案の抗議デモは、憲法は守るべきもので平和は価値のあるもの、という前提が正統性として位置づけられている。\n\nまた、江戸時代の百姓一揆、領主側は百姓の生活安定に努めるべきという考えがあった。こうした考えを打ち出すことで百姓側に「領主とは有り難いもの」という印象を与え、服従を引き出せる(仁政イデオロギー)。逆に領主側がその印象を維持できないと、やるべきことをしていない領主に抗議する、という正統性が生まれる。\n\n一方、抗議相手が「憲法なんか守る必要はない」と主張している場合、それを主張しても意味がない。社会の多くの人々がそう考えていれば、運動は広がりを見せずに失敗する。(正統性の確保の失敗)\n\n実際に、百姓一揆では農具を持って抗議をするという作法があったが、江戸時代後期になると武装を始めるなどする。さらに盗みや放火・殺人をするなど、作法が崩壊し、正統性がなくなった。\n\n日露戦争：1904年2月。日本は苦勝。【6】＿＿＿＿は取れなかった。\n日比谷焼き打ち事件：ロシアから【6】＿＿＿＿を取れなかった政府の外交を弱腰と非難する運動だったが、賃金上昇率とがんばりが結びつかない不満を持つ人々がそれに合流して暴動に発展し、正統性が失われたもの。\n\nSEALDs：安全保障関連法案のとき、結成された学生団体。自由と民主主義を尊重するために日本国憲法を守るべきだ、という主張で発足した。しかし、メンバー内の慰安婦やフェミニズムなどの問題への思想に対する批判が出た(関係ない側面で正統性を欠いているとされた)。ある一面で正統性が認められた運動が、別の側面で正統性を欠くように見える\n合流した運動が一つの正統性を持つことができなかった\n\n運動を起こすには個人が結びつき私たちとなる必要がある\nしかしその結びつきの軸が多様化し、一つの私たちを立ち上げられなくなっている\n\n多様な私たちの存在を認められるのはいいが、私たちの対立があるなかどう声を上げるべきなのか？\nどうすればより大きな私たちが可能になるのか？\n\n社会契約説：国家は個人相互の契約に基づいているという考え。人民が自己の【7】＿＿＿＿を国家に信託することに由来。ホッブズ・ロック・ルソー。\n\n松方財政：【8】＿＿＿＿の政策。厳しい緊縮財政が【9】＿＿＿＿を招く。資本主義経済の基盤。\n秩父事件：松方【9】＿＿＿＿政策により起きた。農民が困民党を組織、減税を叫ぶ。\n\n〔補足問題｜原文への追記〕\n国連憲章で個別的・集団的自衛権を定めるのは第【10】＿＿＿＿条である。","answers":[{"number":1,"value":"外国の武力侵略","line":2},{"number":2,"value":"人間一人ひとりの生命や人権","line":4},{"number":3,"value":"人間の潜在能力","line":6},{"number":4,"value":"岸信介","line":10},{"number":5,"value":"同性愛者・両性愛者・トランスジェンダー","line":14},{"number":6,"value":"賠償金","line":25},{"number":7,"value":"権利を守るための権力","line":36},{"number":8,"value":"1880年","line":38},{"number":9,"value":"デフレ","line":39},{"number":10,"value":"51","line":0}],"n":10},"C":{"question":"安全保障：外国の武力侵略から国家の安全を防衛すること。勢力均衡方式(戦前)と【1】＿＿＿＿(戦後)。\n\n人間の安全保障：国家だけでなく人間一人ひとりの生命や人権を大切にしようという考え。UNDPが【2】＿＿＿＿に提唱。\n\nアマーティア=セン：イギリスの経済学者。人間の潜在能力（識字能力や自由な言語能力）の育成が飢餓や貧困の対策に重要だと説いた。\n\n安全保障関連法案：日本の同盟国が攻撃されたときに自衛隊が出動することを可能にする法案。「集団的自衛権の行使」は9条に違反しないと政府は主張。反対派は憲法違反を主張し、実際にはアメリカの戦争に日本が巻き込まれるだけのマイナスしかない法案だと主張。与党側がこの法案を指示することは最初から分かっていたので、デモや抗議集会が起こった。\n\n安保反対闘争：岸信介内閣の時に起きた。旧安保条約の改定交渉が1958年10月から始まり、世界の緊張緩和に逆行する内容のそれを批判するため、日米安全保障条約改定阻止国民会議を結成。結局【3】＿＿＿＿され、解散。\n\nこのようなデモ活動は憲法21条「集会の自由」によって法に従って行われたもの。\n\n性的少数者(セクシュアルマイノリティ)：同性愛者・両性愛者・トランスジェンダーを自称する人々。\n\n正統性(漢字に注意。「当」でなく「統」)：運動参加者と相手に共有されている価値観のこと。たとえば、安全保障関連法案の抗議デモは、憲法は守るべきもので平和は価値のあるもの、という前提が正統性として位置づけられている。\n\nまた、江戸時代の百姓一揆、領主側は百姓の生活安定に努めるべきという考えがあった。こうした考えを打ち出すことで百姓側に「領主とは有り難いもの」という印象を与え、【4】＿＿＿＿(仁政イデオロギー)。逆に領主側がその印象を維持できないと、やるべきことをしていない領主に抗議する、という正統性が生まれる。\n\n一方、抗議相手が「憲法なんか守る必要はない」と主張している場合、それを主張しても意味がない。社会の多くの人々がそう考えていれば、運動は広がりを見せずに失敗する。(【5】＿＿＿＿)\n\n実際に、百姓一揆では農具を持って抗議をするという作法があったが、江戸時代後期になると武装を始めるなどする。さらに盗みや放火・殺人をするなど、作法が崩壊し、正統性がなくなった。\n\n日露戦争：1904年2月。日本は苦勝。【6】＿＿＿＿。\n日比谷焼き打ち事件：日露講和の条件を不満として政府の外交を弱腰と非難する運動だったが、賃金上昇率とがんばりが結びつかない不満を持つ人々がそれに合流して暴動に発展し、正統性が失われたもの。\n\nSEALDs：安全保障関連法案のとき、結成された学生団体。自由と民主主義を尊重するために日本国憲法を守るべきだ、という主張で発足した。しかし、メンバー内の慰安婦やフェミニズムなどの問題への思想に対する批判が出た(関係ない側面で正統性を欠いているとされた)。ある一面で正統性が認められた運動が、別の側面で正統性を欠くように見える\n合流した運動が一つの正統性を持つことができなかった\n\n 直す理性。【14】＿＿＿＿。\nルソー：【15】＿＿＿＿\n\n選挙が意思を表明する機会とされていたがそれが使い勝手が必ずしも良くない\nデモや住民投票、ITを活用した【16】＿＿＿＿\n民主主義：私たちの問題を私たちで解決する\n\n(参政党\nなぜ勝てている\n大川隆法\n幸福の科学の残党\n共産党から弾かれた人\n地方で地道に勢力を蓄えて生きている\n能力がある連中が裏方にいる)\n\n〔補足問題｜原文への追記〕\n政治的有効性感覚には自分の能力に関する内的側面と、政府の【17】＿＿＿＿性に関する外的側面がある。","answers":[{"number":1,"value":"雨傘運動","line":4},{"number":2,"value":"汚職やバブル崩壊などで政治不信を引き起こし","line":7},{"number":3,"value":"社会的不平等の個人化","line":13},{"number":4,"value":"個人の成功・失敗にみなされる","line":14},{"number":5,"value":"集団階層から個別の状況や個人史","line":15},{"number":6,"value":"自分の世界に閉じこもる","line":17},{"number":7,"value":"社会の解体","line":19},{"number":8,"value":"1930代","line":24},{"number":9,"value":"しかし個人の自由は尊重すべき","line":26},{"number":10,"value":"対話的理性","line":27},{"number":11,"value":"関係性・社会からの排斥","line":29},{"number":12,"value":"最も効率的な手段を考える理性","line":31},{"number":13,"value":"殺人なども命令とあらば行う","line":33},{"number":14,"value":"道具的理性の対義語","line":35},{"number":15,"value":"社会契約説","line":36},{"number":16,"value":"オープンガバメント","line":39},{"number":17,"value":"応答","line":0}],"n":17}},"7":{"A":{"question":"制限選挙\n普通選挙\n\nアリストテレス\n等しいものは等しく扱われるべき\n等しくないものは等しくなく扱われるべき\n【1】＿＿＿＿：人々を結びつける友情を快楽・利益・人柄の3つに分け、人柄によるものを最も重んじた。\n\n12の布と、12求める人と6求める人があったとき\n・6はどちらも求めている。等しいものは等しく取り扱い、3を両者に与え、残り6は片方しか求めていないため等しくないものを等しくなく取り扱い、すべて与える。結果9と3。(タルムード分配)\n・比率で考える。12:6=2:1なので、結果8と4。(比例分配)\n\n株は？\nAが3、Bが2持っていた時とAが3、Bが1、B'が1のとき(方針AとB)\n・個人で判定すると前者で拮抗、後者はAが勝つ＝＞株の重さがBの所持状態で変わる\n・株数の場合、どちらもAが勝つ\n【2】＿＿＿＿が適している\n\n課税について\n【3】＿＿＿＿：一律の課税(人頭税)は等しくないものを等しくなく扱っていると批判し導入されたもの。比例税では300に30、10000に100だったがそれでも不効用は公平でないので。\n\n【4】＿＿＿＿：イギリス初の女性首相。鉄の女。人頭税で反発を受ける。\n【5】＿＿＿＿：アルゼンチン軍によるイギリス領の南大西洋の諸島への侵攻をきっかけとする武力衝突\n\n【6】＿＿＿＿：提案者がSを、応答者が10-Sを受け取る。Sが10-Sより大きいと応答者はそれを拒否する傾向がある。不平等を嫌う心情。セロトニンレベルが低いほど傾向が強い。\n\n【7】＿＿＿＿：アメリカの倫理学者。「【8】＿＿＿＿」：自由競争がもたらす不平等の限度。自分が社会のどの立場になるか分からない状態で、誰にとっても公平な社会のルールを考える。公平を求める。競争社会がもたらす不平等のあるべき限度。\n\n公正としての正義\n社会の法や制度の根本となる正義の原理は、各人が将来どのような能力や地位を持つことになるか知らされてない(【9】＿＿＿＿が掛けられた原初状態)を想定、その中で社会の成員の合意に基づいて承認されなければならない。\n1:他の人の権利侵害しない限り基本的に自由(平等な自由の原理)\n2:競争によって格差が生まれるとしても機会は平等であるべき(公正な機会均等の原理)\n3:競争により生じる格差は社会の最も不遇な人々の生活の改善につながるべき(格差の原理)\n\n以上が【10】＿＿＿＿の段階であるべきだ\n\n【7】＿＿＿＿のいう公正とは、【11】＿＿＿＿、社会的地位などに左右されず、誰もが納得できる公平なルールに基づいて社会が成り立っていること。単に全員を同じように扱うのではなく、機会の平等を保障し、格差が生じる場合も最も不遇な人々の利益になることを重視する。\nつまり、公正＝全員が同じ結果になることではなく、社会のルールや格差のあり方が公平であること。\n\n〔補足問題｜原文への追記〕\n無知のヴェールは、自分の立場を知らない【12】＿＿＿＿上の状況を想定する方法である。","answers":[{"number":1,"value":"フィリア(友愛)","line":8},{"number":2,"value":"一株一票","line":18},{"number":3,"value":"累進課税","line":21},{"number":4,"value":"サッチャー","line":23},{"number":5,"value":"フォークランド戦争","line":24},{"number":6,"value":"最後通牒ゲーム","line":26},{"number":7,"value":"ロールズ","line":28},{"number":8,"value":"正義論","line":28},{"number":9,"value":"無知のヴェール","line":31},{"number":10,"value":"社会契約","line":36},{"number":11,"value":"生まれや能力","line":38},{"number":12,"value":"思考実験","line":0}],"n":12},"B":{"question":"制限選挙\n普通選挙\n\nアリストテレス\n等しいものは等しく扱われるべき\n等しくないものは等しくなく扱われるべき\nフィリア(友愛)：人々を結びつける友情を【1】＿＿＿＿の3つに分け、人柄によるものを最も重んじた。\n\n12の布と、12求める人と6求める人があったとき\n・6はどちらも求めている。等しいものは等しく取り扱い、3を両者に与え、残り6は片方しか求めていないため等しくないものを等しくなく取り扱い、すべて与える。結果9と3。(タルムード分配)\n・比率で考える。12:6=2:1なので、結果8と4。(比例分配)\n\n株は？\nAが3、Bが2持っていた時とAが3、Bが1、B'が1のとき(方針AとB)\n・個人で判定すると前者で拮抗、後者はAが勝つ＝＞株の重さがBの所持状態で変わる\n・株数の場合、どちらもAが勝つ\n一株一票が適している\n\n課税について\n累進課税：一律の課税(【2】＿＿＿＿)は等しくないものを等しくなく扱っていると批判し導入されたもの。比例税では300に30、10000に100だったがそれでも不効用は公平でないので。\n\nサッチャー：イギリス初の女性首相。【3】＿＿＿＿。【2】＿＿＿＿で反発を受ける。\nフォークランド戦争：【4】＿＿＿＿が行った、イギリスのフォークランド諸島への侵攻\n\n最後通牒ゲーム：合計10を分配し、提案者がSを、【5】＿＿＿＿を受け取る。提案者の取り分が応答者より大きいと、応答者はそれを拒否する傾向がある。不平等を嫌う心情。セロトニンレベルが低いほど傾向が強い。\n\nロールズ：アメリカの倫理学者。「【6】＿＿＿＿」：自由競争がもたらす不平等の限度。【7】＿＿＿＿、誰にとっても公平な社会のルールを考える。公平を求める。競争社会がもたらす不平等のあるべき限度。\n\n公正としての正義\n社会の法や制度の根本となる正義の原理は、各人が将来どのような能力や地位を持つことになるか知らされてない(【8】＿＿＿＿が掛けられた原初状態)を想定、その中で社会の成員の合意に基づいて承認されなければならない。\n1:他の人の権利侵害しない限り基本的に自由(平等な自由の原理)\n2:競争によって格差が生まれるとしても機会は平等であるべき(公正な機会均等の原理)\n3:競争により生じる格差は社会の最も不遇な人々の生活の改善につながるべき(格差の原理)\n\n以上が【9】＿＿＿＿の段階であるべきだ\n\nロールズのいう公正とは、【10】＿＿＿＿、社会的地位などに左右されず、誰もが納得できる公平なルールに基づいて社会が成り立っていること。【11】＿＿＿＿、機会の平等を保障し、格差が生じる場合も最も不遇な人々の利益になることを重視する。\nつまり、公正＝全員が同じ結果になることではなく、社会のルールや格差のあり方が公平であること。\n\n〔補足問題｜原文への追記〕\nロールズの格差原理では、最も不遇な人々の利益が【12】＿＿＿＿されることが格差の許容条件になる。","answers":[{"number":1,"value":"快楽・利益・人柄","line":8},{"number":2,"value":"人頭税","line":21},{"number":3,"value":"鉄の女","line":23},{"number":4,"value":"アルゼンチン政府","line":24},{"number":5,"value":"応答者が10-S","line":26},{"number":6,"value":"正義論","line":28},{"number":7,"value":"自分が社会のどの立場になるか分からない状態で","line":28},{"number":8,"value":"無知のヴェール","line":31},{"number":9,"value":"社会契約","line":36},{"number":10,"value":"生まれや能力","line":38},{"number":11,"value":"単に全員を同じように扱うのではなく","line":38},{"number":12,"value":"最大化","line":0}],"n":12},"C":{"question":"制限選挙\n普通選挙\n\nアリストテレス\n等しいものは等しく扱われるべき\n等しくないものは等しくなく扱われるべき\nフィリア(友愛)：人々を結びつける友情を快楽・利益・人柄の3つに分け、【1】＿＿＿＿。\n\n12の布と、12求める人と6求める人があったとき\n・6はどちらも求めている。等しいものは等しく取り扱い、3を両者に与え、残り6は片方しか求めていないため等しくないものを等しくなく取り扱い、すべて与える。結果【2】＿＿＿＿。(タルムード分配)\n・比率で考える。12:6=2:1なので、結果8と4。(【3】＿＿＿＿)\n\n株は？\nAが3、Bが2持っていた時とAが3、Bが1、B'が1のとき(方針AとB)\n・個人で判定すると前者で拮抗、後者はAが勝つ＝＞株の重さがBの所持状態で変わる\n・株数の場合、【4】＿＿＿＿\n【5】＿＿＿＿\n\n課税について\n累進課税：全員から同額を徴収する方式は等しくないものを等しくなく扱っていると批判し導入されたもの。比例税では300に30、10000に100だったがそれでも不効用は公平でないので。\n\nサッチャー：イギリス初の女性首相。鉄の女。【6】＿＿＿＿。\n南大西洋の領有権をめぐる戦争：アルゼンチン政府が行った、【7】＿＿＿＿\n\n最後通牒ゲーム：提案者がSを、応答者が10-Sを受け取る。Sが10-Sより大きいと応答者はそれを拒否する傾向がある。不平等を嫌う心情。【8】＿＿＿＿。\n\nロールズ：アメリカの倫理学者。「正義論」：自由競争を認めながら格差をどう正当化すべきかを考察。自分が社会のどの立場になるか分からない状態で、【9】＿＿＿＿。公平を求める。【10】＿＿＿＿。\n\n公正としての正義\n社会の法や制度の根本となる正義の原理は、各人が将来どのような能力や地位を持つことになるか知らされてない(【11】＿＿＿＿が掛けられた原初状態)を想定、その中で社会の成員の合意に基づいて承認されなければならない。\n1:他の人の権利侵害しない限り基本的に自由(【12】＿＿＿＿)\n2:競争によって格差が生まれるとしても機会は平等であるべき(【13】＿＿＿＿)\n3:競争により生じる格差は社会の最も不遇な人々の生活の改善につながるべき(【14】＿＿＿＿)\n\n以上が社会契約の段階であるべきだ\n\nロールズのいう公正とは、生まれや能力、社会的地位などに左右されず、誰もが納得できる公平なルールに基づいて社会が成り立っていること。単に全員を同じように扱うのではなく、機会の平等を保障し、格差が生じる場合も最も不遇な人々の利益になることを重視する。\nつまり、公正＝全員が同じ結果になることではなく、【15】＿＿＿＿。\n\n〔補足問題｜原文への追記〕\n最後通牒ゲームで応答者が提案を拒否すると、両者の取り分は【16】＿＿＿＿になる。","answers":[{"number":1,"value":"人柄によるものを最も重んじた","line":8},{"number":2,"value":"9と3","line":11},{"number":3,"value":"比例分配","lin },{"number":3,"value":"安心社会","line":13},{"number":4,"value":"一般的信頼","line":21},{"number":5,"value":"複雑性の縮減","line":25},{"number":6,"value":"社会関係資本","line":27},{"number":7,"value":"社会の協力関係を支える資源のこと","line":27},{"number":8,"value":"歴史の終わり","line":29},{"number":9,"value":"0.4","line":34},{"number":10,"value":"予測可能性","line":0}],"n":10},"C":{"question":"カント：ドイツの哲学者。アンチノミーを割り切るのではなくなぜ成立しているように見えるのか考察するのが大切。アンチノミーの例として、人間は自由意志を持つvsすべては【1】＿＿＿＿により決定されている。\n二律背反(アンチノミー)：2つの背反する言明が同時に成り立つように見える状態のこと\n\nある「テーゼ」があり、その「アンチテーゼ」があれば、両者をアウフヘーベン(本質を活かしながら統合)してジンテーゼ(いいとこどり)を導こう->ヘーゲルの弁証法\n\n日本では、財布を落としたら帰ってくる、と言われているのに、「人をみたら泥棒と思え」と人々は思っている\nアメリカでは、「渡る世間に鬼はない」と人々は思っているが、【2】＿＿＿＿\n\n日本人は他人は自分のことばかり考えていると思っている。【3】＿＿＿＿。\n日本人が「信頼」を重く受け止めている、という解釈もあるが、対人関係に慎重な態度をとる側面も否定できない\n\n信頼社会でなく安心社会(個人が特定集団に長期間所属することで安心を得る社会。集団に所属し続けることで信頼を得る)だったから？\n終身雇用や年功序列もその例\nしかしそれにも変化。社会の流動性が高まり、固定した人間関係に縛られるのを忌避するようになっている\nそうなると、集団の所属から脱却して【4】＿＿＿＿する必要がある\n\n他者の感情や思考を理解し、社会的に適切に行動する能力を【5】＿＿＿＿と呼ぶなら、だれが信頼できるか見分ける目は【5】＿＿＿＿と呼べる\n世の人を疑ってかかるより信じていたほうが【5】＿＿＿＿は育つのでは？と筆者\n\nアメリカの一般的信頼が高いのは、契約社会では初対面の相手にも一定の信用を置かなければ関係を築けないからだろうと\n\n「安心」だから「安全」とは限らない。事故が今まで起きていないからと言ってその方法が安全だという確証はない。\n\nルーマン：ドイツの社会学者。信頼を「複雑性の縮減」という視点から定義している。自由に動く人間の予想外の動きを疑っていては行動を起こせないために人々は他人の動きを想定、断定して行動している。この断定を「信頼」と呼ぶとしている。\n\nパットナム：アメリカの政治学者。「社会関係資本」とは人々の間の信頼・互酬性の規範（助け合い）・ネットワークなど、【6】＿＿＿＿。人々は社会関係資本を前提に自分の判断をするようになる。アメリカの信頼が高いのは諸団体によって培われた人間関係？\n\nフクヤマ：アメリカの政治学者。「歴史の終わり？」という論文。自由民主主義体制が人類にとっての最後の政府体制。「信頼」の存在の有無。\n\n渡る世間は鬼ばかりであるし、かといって自分の属する組織内部では私を活かすこともできない(集団意識故)\n組織から見放されたら生きていけないと思っている限り信頼社会は日本で成り立たない。\n\nピア・ネットワーク：同等者の相互評価。人と人のつながりを築く。しかしジニ係数(国内の所得格差を示す指標)が先進国でも0.4を超えている。こんななかで同等者を前提としたシステム(【7】＿＿＿＿)が機能するのか？\n\n〔補足問題｜原文への追記〕\n見知らぬ他者と協力するには、相手の行動の【8】＿＿＿＿を引き受ける必要がある。","answers":[{"number":1,"value":"自然法則","line":2},{"number":2,"value":"訴訟社会","line":8},{"number":3,"value":"他人を信用していない","line":10},{"number":4,"value":"自分で信頼できるかを判断","line":16},{"number":5,"value":"社会的知性","line":19},{"number":6,"value":"社会の協力関係を支える資源のこと","line":27},{"number":7,"value":"カーシェアやネットオークション・Uberなど","line":34},{"number":8,"value":"不確実性","line":0}],"n":8}},"9":{"A":{"question":"他人を助けるのは良いことだという判断は「道徳」\n財政や経済においては困っている人を助けるのは必ずしも善ではない\n一方が【1】＿＿＿＿もう一方が負担者になることにどれだけ寛容でいられるか？\n正義だから税を払え、はどこまで受け入れられるか？\n人はなぜ助け合うか\n「生存」という【2】＿＿＿＿があるから\n便利な道具は【2】＿＿＿＿のために共有される\nその範囲が広がり、必要財源は税として集めるという形式になる\n\n共通の利益を実現することの重要性\n\n【3】＿＿＿＿：国が生まれた理由について、「われわれが生存するための必要によるものであったが、いまやそれは我々の生活を良くすることにある」\n【4】＿＿＿＿：「さまざまの利害の中にある共通なものこそ、社会のきずなを形作る」\n【5】＿＿＿＿：イギリスの政治哲学者。「【6】＿＿＿＿」。独立をためらう植民地の人の心を動かす(アメリカ植民地はイギリスから搾取されるのみで何の利益も得ていない)。「社会の共通の利益と人間の共通の権利」\n【7】＿＿＿＿：アメリカの経済学者。【8】＿＿＿＿。自由な経済活動の重要性を説き、小さな政府・自由放任政策の復活を主張。この経済学者でさえ、「国家がなければ意見の割れで社会が分裂する」という。\n\n【8】＿＿＿＿：直前に登場した経済学者が提唱。ケインズ経済学を批判し、政府の経済への介入は効果がないと主張。\n\nでは、どこまでが【2】＿＿＿＿？\n【9】＿＿＿＿はすべての親・子供に共通するニーズだが、独身層などのニーズではない層も存在する。\n医療は共通と言えそうだが、何割負担が適切かは論理的に決めることはできない\n\nニーズを【10】＿＿＿＿で満たしてきた日本にとって税は取られるものだろうが、社会の蓄えを増やしているととらえて負担を分かち合うことを受容できるかが助け合いの社会の鍵では\n\n〔補足問題｜原文への追記〕\n北米植民地で武力衝突が始まった翌年、ペインが独立を訴える小冊子を刊行したのは【11】＿＿＿＿年。","answers":[{"number":1,"value":"受益者","line":4},{"number":2,"value":"共通のニーズ","line":7},{"number":3,"value":"アリストテレス","line":13},{"number":4,"value":"ルソー","line":14},{"number":5,"value":"トマス=ペイン","line":15},{"number":6,"value":"コモンセンス","line":15},{"number":7,"value":"ミルトン・フリードマン","line":16},{"number":8,"value":"マネタリズム","line":16},{"number":9,"value":"子育て","line":21},{"number":10,"value":"自己責任","line":24},{"number":11,"value":"1776","line":0}],"n":11},"B":{"question":"他人を助けるのは良いことだという判断は「道徳」\n財政や経済においては困っている人を助けるのは必ずしも善ではない\n一方が【1】＿＿＿＿もう一方が負担者になることにどれだけ寛容でいられるか？\n正義だから税を払え、はどこまで受け入れられるか？\n人はなぜ助け合うか\n「生存」という【2】＿＿＿＿があるから\n便利な道具は【2】＿＿＿＿のために共有される\nその範囲が広がり、必要財源は税として集めるという形式になる\n\n共通の利益を実現することの重要性\n\nアリストテレス：国が生まれた理由について、「われわれが生存するための必要によるものであったが、いまやそれは我々の生活を良くすることにある」\nルソー：「【3】＿＿＿＿、社会のきずなを形作る」\nトマス=ペイン：イギリスの政治哲学者。「【4】＿＿＿＿」。独立をためらう植民地の人の心を動かす(アメリカ植民地は【5】＿＿＿＿されるのみで何の利益も得ていない)。「社会の共通の利益と人間の共通の権利」\nミルトン・フリードマン：アメリカの経済学者。【6】＿＿＿＿。自由な経済活動の重要性を説き、小さな政府・【7】＿＿＿＿の復活を主張。フリードマンでさえ、「国家がなければ意見の割れで社会が分裂する」という。\n\n【6】＿＿＿＿：フリードマンが提唱。【8】＿＿＿＿を批判し、政府の経済への介入は効果がないと主張。\n\nでは、どこまでが【2】＿＿＿＿？\n【9】＿＿＿＿はすべての親・子供に共通するニーズだが、独身層などのニーズではない層も存在する。\n医療は共通と言えそうだが、何割負担が適切かは論理的に決めることはできない\n\nニーズを【10】＿＿＿＿で満たしてきた日本にとって税は取られるものだろうが、社会の蓄えを増やしているととらえて負担を分かち合うことを受容できるかが助け合いの社会の鍵では\n\n〔補足問題｜原文への追記〕\n1776年1月、ペインは『コモン・センス』で英本国との【11】＿＿＿＿ではなく独立を訴えた。","answers":[{"number":1,"value":"受益者","line":4},{"number":2,"value":"共通のニーズ","line":7},{"number":3,"value":"さまざまの利害の中にある共通なものこそ","line":14},{"number":4,"value":"コモンセンス","line":15},{"number":5,"value":"イギリスから搾取","line":15},{"number":6,"value":"マネタリズム","line":16},{"number":7,"value":"自由放任政策","line":16},{"number":8,"value":"ケインズ経済学","line":18},{"number":9,"value":"子育て","line":21},{"number":10,"value":"自己責任","line":24},{"number":11,"value":"和解","line":0}],"n":11},"C":{"question":"他人を助けるのは良いことだという判断は「道徳」\n財政や経済においては困っている人を助けるのは必ずしも善ではない\n一方が受益者もう一方が負担者になることにどれだけ寛容でいられるか？\n正義だから税を払え、はどこまで受け入れられるか？\n人はなぜ助け合うか\n「生存」という【8】＿＿＿＿があるから\n便利な道具は【8】＿＿＿＿のために共有される\nその範囲が広がり、【1】＿＿＿＿\n\n共通の利益を実現することの重要性\n\nアリストテレス：国が生まれた理由について、「われわれが生存するための必要によるものであったが、いまやそれは我々の【2】＿＿＿＿ことにある」\nルソー：「さまざまの利害の中にある共通なものこそ、【3】＿＿＿＿」\nトマス=ペイン：イギリスの政治哲学者。「コモンセンス」。独立をためらう植民地の人の心を動かす(アメリカ植民地はイギリスから搾取されるのみで何の利益も得ていない)。「【4】＿＿＿＿」\nミルトン・フリードマン：アメリカの経済学者。マネタリズム。自由な経済活動の重要性を説き、小さな政府・【5】＿＿＿＿の復活を主張。フリードマンでさえ、「【6】＿＿＿＿」という。\n\nマネタリズム：フリードマンが提唱。ケインズ経済学を批判し、【7】＿＿＿＿。\n\nでは、どこまでが【8】＿＿＿＿？\n子育てはすべての親・子供に共通するニーズだが、独身層などのニーズではない層も存在する。\n医療は共通と言えそうだが、【9】＿＿＿＿\n\nニーズを自己責任で満たしてきた日本にとって税は取られるものだろうが、社会の蓄えを増やしているととらえて【10】＿＿＿＿ことを受容できるかが助け合いの社会の鍵では\n\n〔補足問題｜原文への追記〕\n『コモン・センス』が独立世論を後押しし、1776年7月に採択された文書は【11】＿＿＿＿である。","answers":[{"number":1,"value":"必要財源は税として集めるという形式になる","line":9},{"number":2,"value":"生活を良くする","line":13},{"number":3,"value":"社会のきずなを形作る","line":14},{"number":4,"value":"社会の共通の利益と人間の共通の権利","line":15},{"number":5,"value":"自由放任政策","line":16},{"number":6,"value":"国家がなければ意見の割れで社会が分裂する","line":16},{"number":7,"value":"政府の経済への介入は効果がないと主張","line":18},{"number":8,"value":"共通のニーズ","line":20},{"number":9,"value":"何割負担が適切かは論理的に決めることはできない","line":22},{"number":10,"value":"負担を分かち合う","line":24},{"number":11,"value":"アメリカ独立宣言","line":0}],"n":11}}};
const el={chapter:document.getElementById('chapter'),pattern:document.getElementById('pattern'),question:document.getElementById('question'),answer:document.getElementById('answer'),grid:document.getElementById('answer-grid'),counts:document.getElementById('counts'),progress:document.getElementById('progress'),title:document.getElementById('page-title'),caption:document.getElementById('pattern-caption'),toggle:document.getElementById('toggle'),reset:document.getElementById('reset'),print:document.getElementById('print'),printQuestion:document.getElementById('print-question')};
const seen=new Map();
const captions={A:'主に概念・人名を問う',B:'定義・関連事項を問う',C:'具体例・周辺知識を問う'};
for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=String(i);o.textContent=`第${i}章`;el.chapter.append(o)}
let allAnswersVisible=false;
const currentKey=()=>`${el.chapter.value}-${el.pattern.value}`;
const currentData=()=>DATA[el.chapter.value][el.pattern.value];
const currentSeen=()=>{const key=currentKey();if(!seen.has(key))seen.set(key,new Set());return seen.get(key)};
const numLabel=n=>`【${n}】`;
function progress(){let revealed=currentSeen().size;let total=currentData().n;el.progress.textContent=`個別確認：${revealed} / ${total}問`}
function render(){
  const d=currentData(),answers=new Map(d.answers.map(x=>[x.number,x.value]));
  el.question.replaceChildren();
  const rx=/【(\d+)】＿＿＿＿/g;
  let last=0,m;
  while((m=rx.exec(d.question))!==null){
    if(m.index>last)el.question.append(document.createTextNode(d.question.slice(last,m.index)));
    const n=Number(m[1]),span=document.createElement('span');
    span.className='blank';span.dataset.number=String(n);span.setAttribute('role','button');span.setAttribute('tabindex','0');
    span.setAttribute('aria-label',`${numLabel(n)}の答えを確認`);
    const visible=currentSeen().has(n);
    span.textContent=visible?`${numLabel(n)}${answers.get(n)}`:`${numLabel(n)}＿＿＿＿`;
    if(visible)span.classList.add('revealed');
    el.question.append(span);last=rx.lastIndex;
  }
  if(last<d.question.length)el.question.append(document.createTextNode(d.question.slice(last)));
  el.grid.replaceChildren();
  for(const ans of d.answers){
    const item=document.createElement('button');item.type='button';item.className='key-item';
    item.setAttribute('aria-label',`${numLabel(ans.number)}の確認状態を切り替え`);
    const number=document.createElement('span');number.className='key-num';number.textContent=numLabel(ans.number);
    const content=document.createElement('span');content.className='key-content';content.textContent=ans.value;
    const source=document.createElement('span');source.className='key-source';source.textContent=ans.line===0?'追加問題（補足）':`元メモ：章内${ans.line}行目`;
    content.append(source);item.append(number,content);item.addEventListener('click',()=>toggleOne(ans.number));el.grid.append(item);
  }
  el.counts.textContent=`第${el.chapter.value}章 ・ パターン${el.pattern.value} ・ ${d.n}問`;
  el.title.textContent=`第${el.chapter.value}章　パターン${el.pattern.value}`;
  el.caption.textContent=captions[el.pattern.value];
  el.printQuestion.textContent=d.question;
  // Switching a set always hides the full answer list; individual checked blanks remain for this page session.
  el.answer.hidden=!allAnswersVisible;el.toggle.textContent=allAnswersVisible?'解答一覧を隠す':'解答一覧を表示';
  progress();
}
function toggleOne(n){const set=currentSeen();if(set.has(n))set.delete(n);else set.add(n);render()}
el.question.addEventListener('click',ev=>{const t=ev.target.closest('.blank');if(t&&el.question.contains(t))toggleOne(Number(t.dataset.number))});
el.question.addEventListener('keydown',ev=>{if(ev.key!=='Enter'&&ev.key!==' ')return;const t=ev.target.closest('.blank');if(t&&el.question.contains(t)){ev.preventDefault();toggleOne(Number(t.dataset.number))}});
function changeSet(){allAnswersVisible=false;render()}
el.chapter.addEventListener('change',changeSet);el.pattern.addEventListener('change',changeSet);
el.toggle.addEventListener('click',()=>{allAnswersVisible=!allAnswersVisible;el.answer.hidden=!allAnswersVisible;el.toggle.textContent=allAnswersVisible?'解答一覧を隠す':'解答一覧を表示'});
el.reset.addEventListener('click',()=>{currentSeen().clear();render()});
el.print.addEventListener('click',()=>window.print());
render();
</script></body></html>
