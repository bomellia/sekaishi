<h1>思想史・人物名特訓</h1>
<p class="muted">思想・著作・業績から人物名を答える特訓ページです。古典・近代の外国思想家を初期表示とし、全41人から選べます。事件名・訴訟名などに答えが含まれる場合は、それらの固有名詞を設問から伏せています。</p>
<div class="controls"><label class="control">対象<select id="group"><option value="c">古典・近代の外国思想家</option><option value="m">近現代の外国思想家・関連人物</option><option value="j">日本の人物</option><option value="all">全人物</option></select></label>
<label class="control">章<select id="chapter"><option value="all">全章</option><option value="1">第1章</option><option value="2">第2章</option><option value="3">第3章</option><option value="4">第4章</option><option value="5">第5章</option><option value="6">第6章</option><option value="7">第7章</option><option value="8">第8章</option><option value="9">第9章</option></select></label>
<button type="button" class="btn" id="shuffle">シャッフル</button><button type="button" class="btn" id="reset">章順に戻す</button></div>
<div class="stat"><span class="pill" id="count" aria-live="polite">問題数</span><span id="progress" aria-live="polite"></span></div>
<section class="card" aria-label="人物名の穴埋め問題"><div class="eyebrow" id="meta"></div><div class="question" id="question"></div>
<form class="entry" id="form" autocomplete="off"><input type="text" id="input" aria-label="人物名を入力" placeholder="人物名（姓のみでも可）" spellcheck="false" autocapitalize="off">
<button class="btn primary" id="check" type="submit">判定する</button><button class="btn" type="button" id="show">正解を見る</button></form>
<div class="result" id="result" role="status" aria-live="polite"></div>
<div class="answer hidden" id="answer"><strong id="answerName"></strong><small id="answerNote"></small></div>
<div class="grade"><button class="btn primary" id="known" type="button">覚えた</button><button class="btn" id="wrong" type="button">要復習</button><button class="btn" id="next" type="button">次の問題</button></div>
</section>
<div class="tools"><button class="btn" type="button" id="retry">最初から解く</button><button class="btn" type="button" id="review">要復習だけ解く</button><button class="btn" type="button" id="listToggle">問題一覧を表示</button></div>

function start(shuffle=false,missedOnly=false){questions=eligible().filter(x=>!missedOnly||grades.get(x.id)==="wrong").sort((a,b)=>a.chapter-b.chapter);if(shuffle)randomize(questions);i=0;clear();render()}
function progress(){const set=eligible(),correct=set.filter(x=>grades.get(x.id)==="known").length,wrong=set.filter(x=>grades.get(x.id)==="wrong").length;E.count.textContent="全"+questions.length+"問　"+Math.min(i+1,questions.length)+"/"+questions.length;E.progress.textContent="覚えた "+correct+"・要復習 "+wrong+"・未確認 "+(set.length-correct-wrong);E.review.disabled=wrong===0}
function render(){progress();const q=current();if(!q){E.meta.textContent=questions.length?"このセットの問題は終了しました":"該当する問題がありません";E.question.textContent=questions.length?"「最初から解く」または「要復習だけ解く」で再演習できます。":"対象・章を変更してください。";E.form.classList.add("hidden");E.answer.classList.add("hidden");E.result.textContent="";E.known.disabled=E.wrong.disabled=E.next.disabled=true;return}
E.form.classList.remove("hidden");E.meta.textContent="第"+q.chapter+"章　／　"+(i+1)+"問目";E.question.textContent=q.question;E.known.disabled=E.wrong.disabled=E.next.disabled=false;E.show.disabled=visible}
function reveal(){const q=current();if(!q)return;visible=true;E.answerName.textContent=q.answer+(q.full?"（"+q.full+"）":"");E.answerNote.textContent=q.note;E.answer.classList.remove("hidden");E.show.disabled=true}
function next(){if(i<questions.length)i++;clear();render()}
function mark(kind){const q=current();if(q){grades.set(q.id,kind);next()}}
E.form.addEventListener("submit",e=>{e.preventDefault();const q=current();if(!q)return;const v=norm(E.input.value);if(!v){E.result.textContent="人物名を入力してください。";return}if(q.accept.some(a=>norm(a)===v)){reveal();E.result.textContent="正解です。「覚えた」を押すと記録します。"}else E.result.textContent="登録された表記とは一致しません。別表記の可能性があるため正解も確認してください。"});
E.show.addEventListener("click",()=>{reveal();E.result.textContent="正解を表示しました。"});
E.known.addEventListener("click",()=>mark("known"));E.wrong.addEventListener("click",()=>mark("wrong"));E.next.addEventListener("click",next);
E.group.addEventListener("change",()=>start());E.chapter.addEventListener("change",()=>start());E.shuffle.addEventListener("click",()=>start(true));E.reset.addEventListener("click",()=>start());E.retry.addEventListener("click",()=>start());E.review.addEventListener("click",()=>start(false,true));
function list(){E.listItems.replaceChildren();for(const q of eligible()){const details=document.createElement("details");details.className="person";const summary=document.createElement("summary");summary.textContent="第"+q.chapter+"章："+q.question;const p=document.createElement("p");p.textContent=q.answer+(q.full?"（"+q.full+"）":"");const s=document.createElement("small");s.textContent=q.note;details.append(summary,p,s);E.listItems.append(details)}}
E.listToggle.addEventListener("click",()=>{const hidden=E.peopleList.classList.toggle("hidden");E.listToggle.textContent=hidden?"問題一覧を表示":"問題一覧を隠す";if(!hidden)list()});
E.group.addEventListener("change",()=>{if(!E.peopleList.classList.contains("hidden"))list()});E.chapter.addEventListener("change",()=>{if(!E.peopleList.classList.contains("hidden"))list()});
start();
</script></body></html>
